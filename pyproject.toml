[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proof-sdk"
version = "1.0.0"
description = "Official Python SDK for the proof.holdings verification API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "proof.holdings" },
]
keywords = ["proof-holdings", "verification", "sdk", "authentication", "api", "jwt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25.0",
]

[project.optional-dependencies]
jwt = [
    "PyJWT>=2.8.0",
    "cryptography>=41.0.0",
]

[project.urls]
Homepage = "https://proof.holdings"
Documentation = "https://api.proof.holdings/api/docs/"
Repository = "https://github.com/ProofHoldings/sdk-python"
